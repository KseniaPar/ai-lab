<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Knowbase — вход</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="wrap" style="max-width:420px;margin-top:10vh">
    <h1>Knowbase</h1>
    <p class="muted">Личная платформа знаний для подготовки к экзамену</p>
    <div class="card">
      <div class="row" style="margin-bottom:12px">
        <button id="tabLogin" type="button">Вход</button>
        <button id="tabRegister" class="secondary" type="button">Регистрация</button>
      </div>
      <label>Логин</label>
      <input id="username" style="width:100%;margin:8px 0 12px" />
      <label>Пароль</label>
      <input id="password" type="password" style="width:100%;margin:8px 0 12px" />
      <button id="submit" style="width:100%">Войти</button>
      <p id="err" class="error"></p>
    </div>
  </div>
  <script type="module">
    import { api, setAuth, getToken } from '/js/api.js';
    if (getToken()) location.href = '/courses.html';

    let mode = 'login';
    const err = document.getElementById('err');
    document.getElementById('tabLogin').onclick = () => {
      mode = 'login';
      document.getElementById('submit').textContent = 'Войти';
    };
    document.getElementById('tabRegister').onclick = () => {
      mode = 'register';
      document.getElementById('submit').textContent = 'Зарегистрироваться';
    };
    document.getElementById('submit').onclick = async () => {
      err.textContent = '';
      try {
        const body = {
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        };
        const data = await api(`/api/auth/${mode}`, { method: 'POST', body: JSON.stringify(body) });
        setAuth(data.token, data.username);
        location.href = '/courses.html';
      } catch (e) {
        err.textContent = e.message;
      }
    };
  </script>
</body>
</html>
